# Configuracion solo para las pruebas: usa una base H2 en memoria, asi no hace falta MySQL
spring.application.name=contenido-service
spring.datasource.url=jdbc:h2:mem:contenido_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# nginx en la EC2: sirve el frontend en el puerto 80 y reenvia /api/v1/... al microservicio que corresponde.
# Como la pagina y la API salen de la misma direccion, no hay problemas de CORS y no importa que cambie la IP.
# ferreteria.sh instalar lo copia a /etc/nginx/conf.d/ferreteria.conf

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ferreteria;

    root /usr/share/nginx/ferreteria;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/v1/auth       { proxy_pass http://127.0.0.1:8081; }
    location /api/v1/usuarios   { proxy_pass http://127.0.0.1:8081; }
    location /api/v1/productos  { proxy_pass http://127.0.0.1:8082; }
    location /api/v1/categorias { proxy_pass http://127.0.0.1:8082; }
    location /api/v1/ordenes    { proxy_pass http://127.0.0.1:8083; }
    location /api/v1/articulos  { proxy_pass http://127.0.0.1:8084; }
    location /api/v1/contacto   { proxy_pass http://127.0.0.1:8084; }
    location /api/v1/inventario { proxy_pass http://127.0.0.1:8085; }

    # React Router: cualquier otra ruta (/productos/3, /admin, ...) devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

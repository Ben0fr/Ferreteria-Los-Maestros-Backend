# Configuracion solo para las pruebas: usa una base H2 en memoria, asi no hace falta MySQL
spring.application.name=productos-service
spring.datasource.url=jdbc:h2:mem:productos_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Clave JWT solo para las pruebas (minimo 32 caracteres)
app.jwt.secret=clave-de-pruebas-solo-para-tests-1234567890
app.cors.origenes=http://localhost:5173

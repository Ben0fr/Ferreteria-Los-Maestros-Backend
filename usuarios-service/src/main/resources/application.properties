spring.application.name=usuarios-service
server.port=8081
server.error.include-message=always

# Base de datos (crear antes: CREATE DATABASE ferreteria_usuarios;)
spring.datasource.url=jdbc:mysql://localhost:3306/ferreteria_usuarios?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:ferreteria}
spring.datasource.password=${DB_PASSWORD:Ferreteria123!}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT: el secreto debe medir al menos 32 caracteres y ser IGUAL en todos los microservicios
app.jwt.secret=${JWT_SECRET:ferreteria-los-maestros-clave-secreta-muy-larga-2026-cambiar}
app.jwt.access-minutos=30
app.jwt.refresh-dias=7

# Orígenes del frontend permitidos (separados por coma)
app.cors.origenes=http://localhost:5173
